# =============================================================================
# Valores POR DEFECTO de la librería chatbot-rag.
# Se cargan con la prioridad MÁS BAJA (ChatbotDefaultsEnvironmentPostProcessor):
# cualquier valor en el application.yml/properties del proyecto que nos usa,
# o en variables de entorno, gana sobre estos.
#
# Ojo: NO es un application.yml a propósito. Si la librería trajera su propio
# application.yml, podría mezclarse con la configuración del proyecto anfitrión.
# =============================================================================
chatbot.enabled=true

chatbot.rag.top-k=4
chatbot.rag.similarity-threshold=0.35
chatbot.rag.margen-relativo=0.05
chatbot.ingesta.al-iniciar=true
chatbot.rate-limit.preguntas-por-minuto=10

# Postgres + pgvector (BD propia del chatbot)
chatbot.vector-db.url=jdbc:postgresql://localhost:5433/chatbot
chatbot.vector-db.username=chatbot
chatbot.vector-db.password=chatbot
chatbot.vector-db.tabla=conocimiento_vectorial
# bge-m3 = 1024 dimensiones
chatbot.vector-db.dimensiones=1024

# MySQL del monolito (solo lectura). Apagado hasta que el anfitrión lo configure.
chatbot.monolito.enabled=false
chatbot.monolito.url=
chatbot.monolito.username=
chatbot.monolito.password=

# DynamoDB (historial). Apagado hasta que el anfitrión lo configure.
chatbot.historial.enabled=false
chatbot.historial.endpoint=http://localhost:8000
chatbot.historial.region=us-east-1
chatbot.historial.tabla=chatbot_conversaciones
chatbot.historial.dias-retencion=90

# Ollama (LLM + embeddings)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.init.timeout=20m
spring.ai.ollama.init.max-retries=1
spring.ai.ollama.chat.options.model=qwen2.5:3b
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.embedding.options.model=bge-m3
